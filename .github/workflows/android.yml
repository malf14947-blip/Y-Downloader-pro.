name: Build-APK
on: [push]
jobs:
  main-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython==3.0.8
          yes | sdkmanager --licenses || true
      - name: Build
        run: |
          buildozer android clean
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: 1
      - uses: actions/upload-artifact@v4
        with:
          name: Y-Downloader-APK
          path: bin/*.apk
          
